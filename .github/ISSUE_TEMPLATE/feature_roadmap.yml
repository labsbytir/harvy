name: Feature or roadmap request
description: Propose a feature, expansion, or roadmap milestone with measurable acceptance criteria.
title: "[feature]: "
labels: [enhancement, roadmap]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need and observable outcome. Separate current implementation from proposed behavior; do not promise deployment or provider capability before verification.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Collection / discovery
        - Connector
        - Data quality / ontology
        - Search / dossier
        - Query / analytics
        - Authentication / privacy
        - Operations / deployment
        - Core contracts / database / tenancy
        - AI agents / MCP / model routing
        - Engineering standards / tooling
        - Documentation / GitHub Pages
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - V2 connector
        - V2 supervisor or API
        - V2 analytics or storage
        - Shared data model
        - GitHub Pages / repository process
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Who needs this, and what verified gap does it address?
      render: markdown
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and scope
      render: markdown
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
      description: Include fixtures, error handling, accessibility, and measurable completion criteria where relevant.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, gates, and non-goals
      description: Note secrets by name only, source permissions/terms, migration or deployment approvals, and items explicitly out of scope.
      render: markdown
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and coordination
      description: Component owner, OpenChamber task/session if available, base revision, and affected shared-contract owners. Do not include private task content.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Access, compatibility, and recovery
      description: Tenant/role/feature changes, API/HQL/MCP/schema versions, AI/tool permissions, source rights, migration and rollback. Explain if not applicable.
    validations:
      required: true
